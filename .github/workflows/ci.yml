name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  process-contract:
    name: Process contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install published process runtime
        run: python -m pip install --require-hashes -r requirements/process.txt

      - name: Install locked project dependencies
        run: |
          npm ci
          npm run restore

      - name: Validate process distribution and environment
        run: |
          processctl sync --project-root . --check
          processctl doctor --project-root . --profile development
          processctl doctor --project-root . --profile review

      - name: Run finite process profiles
        run: |
          processctl verify --project-root . --profile development
          processctl verify --project-root . --profile review

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Restore locked .NET dependencies
        run: npm run restore

      - name: Audit locked dependency graphs
        run: npm run audit:dependencies

      - name: Build and test
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build production image
        run: docker build --tag axis-reference-product:${{ github.sha }} .
