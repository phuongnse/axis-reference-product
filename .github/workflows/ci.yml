name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Restore locked .NET dependencies
        run: npm run restore

      - name: Audit locked dependency graphs
        run: npm run audit:dependencies

      - name: Build and test
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build production image
        run: docker build --tag axis-reference-product:${{ github.sha }} .
