name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  independent-review:
    name: independent-review
    permissions:
      contents: read
    uses: phuongnse/renovate-ops/.github/workflows/independent-review.yml@48a644b081ea9d098796432750f892e2e3f44614

  process-contract:
    name: Process contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install published process runtime
        uses: phuongnse/engineering-process@cb2563e5a90a644af5be596d9418bb13f065aa12 # v0.4.0
        with:
          project-root: .
          requirements-lock: requirements/process.txt

      - name: Install locked project dependencies
        run: |
          npm ci
          npm run restore

      - name: Validate process distribution and portable environment
        run: |
          processctl sync --project-root . --check
          processctl doctor --project-root . --profile development

      - name: Validate Linux review environment
        if: runner.os == 'Linux'
        run: processctl doctor --project-root . --profile review

      - name: Run portable development profile
        run: processctl verify --project-root . --profile development

      - name: Run governed review profile
        if: runner.os == 'Linux'
        run: processctl verify --project-root . --profile review

  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install published process runtime
        uses: phuongnse/engineering-process@cb2563e5a90a644af5be596d9418bb13f065aa12 # v0.4.0
        with:
          project-root: .
          requirements-lock: requirements/process.txt

      - name: Validate process distribution
        run: |
          processctl sync --project-root . --check
          processctl doctor --project-root .

      - name: Validate complete process adoption candidate
        if: >-
          github.event_name == 'pull_request' &&
          startsWith(github.head_ref, 'automation/process/engineering-process')
        run: >-
          processctl adoption check
          --project-root .
          --requirements-lock requirements/process.txt

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Restore locked .NET dependencies
        run: npm run restore

      - name: Audit locked dependency graphs
        run: npm run audit:dependencies

      - name: Build and test
        run: npm run check

      - name: Unit tests
        run: npm run test:unit
