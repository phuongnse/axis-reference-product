name: Dependency security

on:
  schedule:
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Locked dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Validate locked process dependency graph
        run: |
          python -m pip install --require-hashes -r requirements/process.txt
          python -m pip check

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: server/**/packages.lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Audit locked dependency graphs
        run: npm run audit:dependencies
